version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: tamanna-pos-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: restaurant_pos
    volumes:
      - mongo_data:/data/db
    networks:
      - pos-network

  # 2. Node.js Backend API & Socket Server
  backend:
    build:
      context: ./restaurant-pos-backend
      dockerfile: Dockerfile
    container_name: tamanna-pos-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/restaurant_pos
      JWT_SECRET: pos_super_secret_tamanna_jwt_key_2026
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:80
    depends_on:
      - mongo
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - pos-network

  # 3. React Frontend with Nginx SPA Reverse Proxy
  frontend:
    build:
      context: ./restaurant-pos-frontend
      dockerfile: Dockerfile
    container_name: tamanna-pos-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pos-network

volumes:
  mongo_data:
  backend_uploads:
  backend_logs:

networks:
  pos-network:
    driver: bridge

